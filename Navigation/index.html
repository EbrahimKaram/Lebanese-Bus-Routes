<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <!-- <base href="/"> -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="lebanese_bus_routes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>lebanese_bus_routes</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body {height:100%; margin:0; font-family: system-ui, Arial, sans-serif; background:#111827; color:#fff;}
    #app-loader {position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; z-index:9999; background:radial-gradient(circle at 40% 35%, #1f2d4d, #0d1320);} 
    #app-loader.fade {opacity:0; transition:opacity .35s ease;}
    .loader-logo {display:flex; flex-direction:column; align-items:center; gap:10px;}
    .loader-logo img {width:108px; height:auto; filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));}
    .loader-title {font-size:20px; font-weight:600; letter-spacing:.5px;}
    .spinner {width:54px; height:54px; border:5px solid rgba(255,255,255,.18); border-top-color:#4f46e5; border-radius:50%; animation:spin 1.1s linear infinite;}
    @keyframes spin {to {transform:rotate(360deg)}}
    .loader-sub {font-size:13px; opacity:.7;}
    @media (prefers-color-scheme: light) { html,body{background:#f5f7fa; color:#111}; #app-loader{background:radial-gradient(circle at 40% 35%, #ffffff, #e5e9f2);} .spinner{border:5px solid rgba(0,0,0,.12); border-top-color:#4f46e5;} }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-label="Loading application">
    <div class="loader-logo">
      <img src="favicon.png" alt="App Logo" />
      <div class="loader-title">Lebanon Transit</div>
      <div class="loader-sub">Loading map & routes…</div>
    </div>
    <div class="spinner"></div>
  </div>
  <script>
    // Remove/hide loader after first Flutter frame paints
    window.addEventListener('flutter-first-frame', () => {
      const el = document.getElementById('app-loader');
      if (el) {
        el.classList.add('fade');
        setTimeout(()=> el.remove(), 450);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
